name: cs2clean-release
# Builds a CS2Clean release for Windows and Linux and attaches the artifacts
# to a GitHub release.
#   Actions > cs2clean-release > Run workflow, version e.g. 0.2.0   (creates the tag cs2clean-v0.2.0)
#   or push a tag: git tag cs2clean-v0.2.0, git push origin cs2clean-v0.2.0
# The version is set at build time; package.json in the repo isn't changed.
# The two build jobs only build, test and upload their installers as workflow artifacts. The GitHub release is made
# by the `publish` job at the end, and only when both of them succeeded, so a release never lacks one platform.
#
# Test run (nothing published): Run workflow, pick the branch under test, a throwaway version such as 0.0.1 and
# untick "Create the GitHub release". It builds, runs the sidecar selftests and uploads the installers as workflow
# artifacts (download them from the run's summary page); no tag and no release are created. Never reuse the number
# of a published release for a test run with the box ticked: the release's files would be replaced.
on:
  push:
    tags: ["cs2clean-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true
      publish:
        description: "Create the GitHub release (untick for a build-only test run)"
        type: boolean
        default: true
concurrency:
  group: cs2clean-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release-win:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hero-runtime/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#cs2clean-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      # The csst.at fallback runs in a sidecar (hero-runtime/) with its own Node 22 and its own better-sqlite3, shipped
      # outside app.asar as extraResources. This installs it with the Node 22 above, copies that Node next to it,
      # bundles its CLI and runs its selftest, so the binary that gets packaged is the one that was just tested.
      - name: Hero sidecar (Node 22 and its own better-sqlite3)
        run: npm run hero:install
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run dist
      # The portable build is a zip of the unpacked app plus portable.txt, which makes the app keep its data beside it.
      # It is built on its own, so the marker is in the zip and not in the installer above.
      - run: npm run dist:zip
      - run: ls -l release
      # The selftest again, on the copy inside the package: its Node starts, Hero and better-sqlite3 load from there.
      - name: Check the packaged sidecar
        run: node tools/build-hero-runtime.mjs check release/win-unpacked/resources/hero

      - uses: actions/upload-artifact@v4
        with:
          name: cs2clean-${{ steps.version.outputs.version }}-win
          path: |
            release/*.exe
            release/*.zip
          # No installer is a failed build, not an empty upload.
          if-no-files-found: error

  release-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hero-runtime/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#cs2clean-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      # The csst.at fallback runs in a sidecar (hero-runtime/) with its own Node 22 and its own better-sqlite3, shipped
      # outside app.asar as extraResources. This installs it with the Node 22 above, copies that Node next to it,
      # bundles its CLI and runs its selftest, so the binary that gets packaged is the one that was just tested.
      - name: Hero sidecar (Node 22 and its own better-sqlite3)
        run: npm run hero:install
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx electron-builder --linux --x64
      - run: ls -l release
      - name: Check the packaged sidecar
        run: node tools/build-hero-runtime.mjs check release/linux-unpacked/resources/hero

      - uses: actions/upload-artifact@v4
        with:
          name: cs2clean-${{ steps.version.outputs.version }}-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  # One release for both platforms, made only when both builds (their tests and sidecar checks included) have passed.
  # With a release step in each build job, a failure on one OS still published a final release without that OS's
  # installers, and the app's update check would already have pointed people at it.
  publish:
    # A tag push always publishes; a manual run publishes unless "Create the GitHub release" was unticked.
    # (A job's `if` without a status function also requires both `needs` jobs to have succeeded.)
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: [release-win, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cs2clean-${{ needs.release-win.outputs.version }}-*
          path: release
          merge-multiple: true
      - run: ls -l release
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cs2clean-v${{ needs.release-win.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CS2Clean ${{ needs.release-win.outputs.version }}
          # Without this, a pattern that matches nothing publishes a release that is missing that file.
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
