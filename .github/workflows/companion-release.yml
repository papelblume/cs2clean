name: companion-release
# Builds a companion app release for Windows and Linux and attaches the artifacts
# to a GitHub release.
#   Actions > companion-release > Run workflow, version e.g. 0.2.0   (creates the tag companion-v0.2.0)
#   or push a tag: git tag companion-v0.2.0, git push origin companion-v0.2.0
# The version is set at build time; package.json in the repo isn't changed.
on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true
concurrency:
  group: companion-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#companion-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run dist
      - run: npx electron-builder --win portable --x64
      - run: ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: companion-win-${{ steps.version.outputs.version }}
          path: companion/release/*.exe

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Companion ${{ steps.version.outputs.version }}
          files: |
            companion/release/*.exe

  release-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#companion-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --linux --x64
      - run: ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: companion-linux-${{ steps.version.outputs.version }}
          path: |
            companion/release/*.AppImage
            companion/release/*.tar.gz

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Companion ${{ steps.version.outputs.version }}
          files: |
            companion/release/*.AppImage
            companion/release/*.tar.gz
